name: Snippets
options:
  deploymentTarget:
    macOS: '26.0'
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DUU8J39BA7
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Snippets:
    type: application
    platform: macOS
    sources: [Snippets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edmundlim.snippets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Snippets/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Snippets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/EdmundLimBoEn/snippets/releases/latest/download/appcast.xml
        SUPublicEDKey: JkPStOGp80ZdYDByOfjHmkxGpnZGgjd9E67eqVOoQy0=
        SUEnableAutomaticChecks: true
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
  SnippetsTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SnippetsTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edmundlim.snippets.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Snippets
schemes:
  Snippets:
    build:
      targets:
        Snippets: all
        SnippetsTests: [test]
    test:
      targets: [SnippetsTests]
